# Windows-Build von SpaceX.
#
# Warum ueberhaupt: ein VST3 fuer Windows laesst sich vom Mac aus nicht
# querkompilieren - es braucht einen echten Windows-Rechner mit Visual Studio.
# GitHub stellt genau den kostenlos als Runner bereit. Jeder Push auf main
# (oder ein Klick auf "Run workflow") baut das Plugin und haengt es als
# Download an den Lauf.
name: Windows VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # JUCE wird von CMake selbst geholt (FetchContent) und danach
      # zwischengespeichert - der zweite Lauf ist deutlich schneller.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.2-${{ runner.os }}

      # Steht im Log, falls doch mal etwas nicht passt.
      - name: Toolchain
        shell: pwsh
        run: cmake --version

      # KEIN fest verdrahteter Generator: "-G Visual Studio 17 2022" bricht
      # sofort ab, sobald GitHub das Runner-Image auf eine neuere
      # Visual-Studio-Version hebt. Ohne -G nimmt CMake die neueste
      # installierte Version, -A x64 legt nur die Architektur fest.
      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      # Wo das Bundle landet, haengt vom Generator ab (bei Visual Studio in
      # einem Release-Unterordner, bei Ninja nicht). Statt den Pfad zu raten,
      # wird er gesucht - und bei Misserfolg der Baum ausgegeben.
      - name: Collect
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path build\LCRMSPlugin_artefacts -Recurse -Directory -Filter "SpaceX.vst3" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) {
            Write-Host "SpaceX.vst3 nicht gefunden - Inhalt von build\LCRMSPlugin_artefacts:"
            Get-ChildItem -Path build\LCRMSPlugin_artefacts -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "SpaceX.vst3 nicht gefunden"
          }
          Write-Host "Gefunden: $($found.FullName)"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item -Recurse -Force -Path $found.FullName -Destination out\

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceX-VST3-Windows
          path: out/
          if-no-files-found: error
